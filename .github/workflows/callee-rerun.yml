name: Reusable callee rerun fixture

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Synthetic marker for this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  call-callee:
    uses: mustafagozhamam/bb-gha-env-callee-20260911/.github/workflows/protected-callee.yml@main
    with:
      marker: ${{ inputs.marker }}
